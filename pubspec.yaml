name: trackizer
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Dotted borders
  dotted_border: ^3.1.0

  # Date and number formatting
  intl: ^0.20.2

  # Calendar widget
  table_calendar: ^3.2.0

  # Carousel slider
  carousel_slider: ^5.1.1

  # Card swiper
  flutter_card_swiper: ^7.2.0

  # 🧱 SQLite local database
  sqflite: ^2.3.0

  # 📁 Xử lý đường dẫn tới database file
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/Inter-Regular.ttf
        - asset: assets/font/Inter-Medium.ttf
          weight: 500
        - asset: assets/font/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/font/Inter-Bold.ttf
          weight: 700
